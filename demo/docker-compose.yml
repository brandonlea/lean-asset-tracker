# Public demo: LAT_DEMO=1 (no login, sample data, nightly reset, abuse limits).
# Never put real data in this instance.  Run: docker compose -p lat-demo up -d --build
name: lat-demo
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?set DEMO_DB_PASSWORD in demo/.env}
      POSTGRES_DB: demo
    volumes: [demo-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    deploy: {resources: {limits: {memory: 256m, cpus: "0.5"}}}
  app:
    build: ..
    environment:
      DATABASE_URL: postgresql://demo:${DEMO_DB_PASSWORD}@db:5432/demo
      LAT_DEMO: "1"
      LAT_PUBLIC_URL: ${DEMO_PUBLIC_URL:-https://demo.hallveckdigital.co.uk}
    ports: ["127.0.0.1:8002:8000"]          # Cloudflare Tunnel connects here; never exposed directly
    depends_on: {db: {condition: service_healthy}}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    deploy: {resources: {limits: {memory: 384m, cpus: "0.75"}}}
volumes:
  demo-db:
