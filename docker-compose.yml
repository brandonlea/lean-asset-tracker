# Development stack. Secrets live in .env (git-ignored): POSTGRES_PASSWORD, optional LAT_BIND.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: asset-tracker-db
    environment:
      POSTGRES_USER: tracker_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: asset_tracker
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracker_user -d asset_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: asset-tracker-api
    ports:
      - "${LAT_BIND:-127.0.0.1}:8001:8000"
    environment:
      DATABASE_URL: postgresql://tracker_user:${POSTGRES_PASSWORD}@db:5432/asset_tracker
    depends_on:
      db:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
