<!DOCTYPE html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>Sign in | Lean Asset Tracker</title>
</head>
<body class="antialiased min-h-screen flex items-center justify-center px-4 py-10">
  <main class="w-full max-w-sm">
    <div class="flex items-center gap-2 mb-6">
      <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center shadow-lg shadow-blue-500/20">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4-8-4m16 0l-8 8-8-8"></path></svg>
      </div>
      <span class="text-lg font-extrabold tracking-tight">Lean Asset Tracker</span>
    </div>
    <form method="post" action="/login" class="glass-card rounded-2xl p-6 space-y-4">
      <h1 class="text-2xl font-bold">Sign in</h1>
      <input type="hidden" name="next" value="{{ next or '/' }}">
      {% if error %}<div role="alert" class="text-sm px-3 py-2 rounded-lg bg-red-500/10 text-red-300 ring-1 ring-red-500/40">{{ error }}</div>{% endif %}
      <label class="block"><span class="text-xs font-semibold text-slate-400">Email</span>
        <input class="field mt-1" type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus></label>
      <label class="block"><span class="text-xs font-semibold text-slate-400">Password</span>
        <input class="field mt-1" type="password" name="password" autocomplete="current-password" required></label>
      <button class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white py-3 rounded-lg font-bold transition">Sign in</button>
    </form>
  </main>
</body>
</html>
