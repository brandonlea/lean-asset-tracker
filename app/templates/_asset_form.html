{% from "_tz_select.html" import tz_select %}
<div class="fixed inset-y-0 right-0 w-full max-w-lg bg-slate-900 border-l border-slate-800 shadow-2xl p-5 sm:p-8 z-50 overflow-y-auto animate-slide-in" id="asset-form-panel">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-white">{{ 'Edit device' if edit_id else 'Add a device' }}</h2>
    <button type="button" onclick="document.getElementById('detail-panel').innerHTML=''" aria-label="Close" class="p-2 -m-2 text-slate-500 hover:text-white">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
    </button>
  </div>
  <form hx-post="{{ '/assets/%d/edit' % edit_id if edit_id else '/assets/new' }}" hx-target="#detail-panel" class="space-y-4" data-mode="{{ 'edit' if edit_id else 'new' }}">
    {% if error %}<div role="alert" class="text-sm px-3 py-2 rounded-lg bg-red-500/10 text-red-300 ring-1 ring-red-500/40">{{ error }}</div>{% endif %}
    <label class="block"><span class="text-xs font-semibold text-slate-400">Name *</span>
      <input class="field mt-1" name="name" value="{{ f.name or '' }}" placeholder="e.g. Synology DS920+" maxlength="200" required {{ '' if edit_id else 'autofocus' }}></label>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <label class="block"><span class="text-xs font-semibold text-slate-400">Category *</span>
        <input class="field mt-1" name="category" list="cat-list" value="{{ f.category or '' }}" placeholder="Server, Network…" maxlength="80" required>
        <datalist id="cat-list">{% for c in ["Server","Network","Storage","Compute","Power","Peripheral","Tool","Cable"] %}<option value="{{ c }}">{% endfor %}</datalist></label>
      <label class="block"><span class="text-xs font-semibold text-slate-400">Status</span>
        <select class="field mt-1" name="status">{% for s in statuses %}<option value="{{ s }}" {{ 'selected' if f.status == s }}>{{ s|capitalize }}</option>{% endfor %}</select></label>
    </div>
    <label class="block"><span class="text-xs font-semibold text-slate-400">Serial number</span>
      <input class="field mt-1 font-mono" name="serial_no" value="{{ f.serial_no or '' }}" maxlength="120" autocapitalize="characters"></label>
    <label class="block"><span class="text-xs font-semibold text-slate-400">Location</span>
      <input class="field mt-1" name="location" list="loc-list" value="{{ f.location or '' }}" placeholder="Loft / Rack A / Shelf 2">
      <datalist id="loc-list">{% for p in paths %}<option value="{{ p }}">{% endfor %}</datalist>
      <span class="text-xs text-slate-500">Use / for levels. New places are created for you.</span></label>
    <fieldset class="space-y-3 p-4 rounded-xl bg-slate-800/40 ring-1 ring-slate-700/50">
      <legend class="px-1 text-xs font-bold uppercase tracking-widest text-slate-500">Where it runs (optional)</legend>
      {% with v=f, wrap_id="tz-new" %}{% include "_site_fields.html" %}{% endwith %}
    </fieldset>
    <label class="block"><span class="text-xs font-semibold text-slate-400">Notes</span>
      <textarea class="field mt-1" name="notes" rows="3" maxlength="4000" placeholder="IP, purchase date, warranty…">{{ f.notes or '' }}</textarea></label>
    <div class="flex gap-2 pt-2">
      <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white py-3 rounded-lg font-bold">{{ 'Save changes' if edit_id else 'Save device' }}</button>
      {% if edit_id %}
      <button type="button" hx-get="/assets/{{ edit_id }}/details" hx-target="#detail-panel" class="px-5 bg-slate-700 hover:bg-slate-600 text-slate-200 py-3 rounded-lg font-bold">Cancel</button>
      {% else %}
      <button type="button" onclick="document.getElementById('detail-panel').innerHTML=''" class="px-5 bg-slate-700 hover:bg-slate-600 text-slate-200 py-3 rounded-lg font-bold">Cancel</button>
      {% endif %}
    </div>
  </form>
</div>
